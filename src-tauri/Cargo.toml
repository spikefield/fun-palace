[package]
name = "fun-palace"
version = "0.1.0"
description = "Native cross-platform Eleventy site manager with indieweb support"
authors = []
license = "MIT"
repository = "https://github.com/funpalace/fun-palace"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "fun_palace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
uuid = { version = "1.20.0", features = ["v4"] }
chrono = "0.4.44"

[dev-dependencies]
tempfile = "3.26.0"
